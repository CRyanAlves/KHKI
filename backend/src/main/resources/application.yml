spring:
  session:
    jdbc:
      initialize-schema: never
  application:
    name: khki-api
  datasource:
    url: ${DATABASE_URL:jdbc:h2:file:./data/khki;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE}
    username: ${DATABASE_USER:sa}
    password: ${DATABASE_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true
server:
  port: ${PORT:8080}
  error:
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: 30m
      cookie:
        http-only: true
        same-site: lax
        secure: ${COOKIE_SECURE:false}
khki:
  storage:
    driver: ${MEDIA_STORAGE_DRIVER:local}
    directory: ${MEDIA_STORAGE_DIRECTORY:./data/images}
    endpoint: ${R2_ENDPOINT:}
    bucket: ${R2_BUCKET:}
    access-key: ${R2_ACCESS_KEY_ID:}
    secret-key: ${R2_SECRET_ACCESS_KEY:}
    migrate-legacy: ${MEDIA_MIGRATE_LEGACY:false}
  session:
    remember-duration: ${SESSION_REMEMBER_DURATION:14d}
    maximum-duration: ${SESSION_MAXIMUM_DURATION:12h}
  frontend-origin: ${FRONTEND_ORIGIN:http://localhost:4200}
  admin-email: ${ADMIN_EMAIL:}
  admin-password: ${ADMIN_PASSWORD:}
  demo: ${DEMO_DATA:false}
