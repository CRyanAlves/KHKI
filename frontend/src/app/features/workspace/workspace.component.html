<main class="map-workspace" [class.panel-collapsed]="state.collapsed()">
  <aside #panel id="exploration-panel" class="workspace-panel" aria-label="Painel de exploração" [inert]="state.collapsed()"><router-outlet /></aside>
  <section class="workspace-map" [class.has-location-control]="state.scene() !== 'route'" aria-label="Mapa de banheiros"><app-map [overlayPanel]="true" [panelCollapsed]="state.collapsed()" [bathrooms]="state.mapBathrooms()" [point]="state.scene() === 'route' ? state.routeOrigin() || state.position() : state.position()" [route]="state.path()" [selectedId]="state.selected()?.id || ''" [highlightedId]="state.highlighted()" [preserveViewport]="!!state.area()" (selected)="open($event)" (hovered)="state.highlighted.set($event)" (boundsChanged)="state.bounds.set($event)" />
    @if (maps.configured && state.scene() === 'search') { <button class="button secondary search-area" (click)="searchArea()" [disabled]="state.loading() || !state.bounds()"><app-icon name="Search" [size]="17" />Buscar nesta área</button> }
    @if (state.scene() !== 'route') { <button class="icon-button workspace-locate map-location" aria-label="Usar minha localização" title="Usar minha localização" (click)="state.locate()"><app-icon name="LocateFixed" [size]="18" /></button>@if (state.query) { <div class="workspace-map-tools"><button class="button secondary" (click)="state.locateAddress()">Localizar endereço</button></div> } }
    @if (state.message()) { <div class="map-message" role="status">{{ state.message() }}</div> }
  </section>
  <button class="icon-button panel-toggle" [attr.aria-label]="state.collapsed() ? 'Reabrir painel' : 'Recolher painel'" aria-controls="exploration-panel" [attr.aria-expanded]="!state.collapsed()" (click)="state.collapsed.set(!state.collapsed())"><app-icon class="panel-toggle-icon" name="ArrowLeft" [size]="20" /><span class="mobile-panel-label">{{ state.collapsed() ? 'Mostrar painel' : 'Ver mapa' }}</span></button>
</main>
